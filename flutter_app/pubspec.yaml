name: ai_learning_app
description: "A comprehensive Flutter iOS application for AI-powered language learning"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  lottie: ^3.1.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Network
  http: ^1.2.0
  dio: ^5.4.0
  logger: ^2.0.2+1
  uuid: ^4.2.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  connectivity_plus: ^5.0.2
  
  # Audio & Voice
  speech_to_text: ^6.6.0
  audioplayers: ^5.2.1
  record: ^5.0.4
  permission_handler: ^11.1.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # Media capture/playback (Enhanced Stories)
  image_picker: ^1.0.7
  camera: ^0.10.5+5
  video_player: ^2.8.2
  chewie: ^1.7.4
  file_picker: ^8.0.0
  
  # Web3 & Wallet Integration
  url_launcher: ^6.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_linux: ^1.2.1
