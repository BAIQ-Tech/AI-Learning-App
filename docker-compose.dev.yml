version: '3.8'

services:
  backend:
    build:
      context: .
      target: builder  # Use builder stage for development
    container_name: ai-learning-backend-dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /app/venv  # Exclude virtual environment from volume
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_learning_dev
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    container_name: ai-learning-frontend-dev
    command: sh -c "npm install && npm start"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true  # For file watching in Docker
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true  # Keep container running
    tty: true  # Allocate a pseudo-TTY

  db:
    environment:
      - POSTGRES_DB=ai_learning_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  pgadmin:
    ports:
      - "5050:80"

volumes:
  postgres_data_dev:
  redis_data_dev:
