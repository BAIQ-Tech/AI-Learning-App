services:
  # Backend API Service
  - type: web
    name: ai-learning-backend
    runtime: python
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: "gunicorn backend.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false  # You'll need to set this manually to your existing database URL
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://ai-learning-frontend.onrender.com
    plan: free

  # Frontend Static Site
  - type: web
    name: ai-learning-frontend
    runtime: static
    buildCommand: |
      cd frontend
      npm install
      REACT_APP_API_URL=https://ai-learning-backend.onrender.com npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://ai-learning-backend.onrender.com
      - key: REACT_APP_ENVIRONMENT
        value: production

# Database configuration - you'll need to either:
# 1. Use an existing database, or 
# 2. Upgrade to a paid plan for multiple databases
# 
# For now, comment out the database creation and manually connect
# your existing database to the backend service
#
# databases:
#   - name: ai-learning-db
#     databaseName: ai_learning
#     user: ai_learning_user
#     plan: free
# Trigger backend restart - Fri Sep 26 15:45:00 JST 2025
