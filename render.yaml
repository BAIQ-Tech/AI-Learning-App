services:
  - type: web
    name: ai-learning-backend
    env: python3.11
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -e ".[dev]"
    startCommand: "gunicorn main:application --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --pythonpath ."
    envVars:
      - key: PYTHONPATH
        value: "/opt/render/project/src"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-learning-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
    plan: free
    numInstances: 1

databases:
  - name: ai-learning-db
    databaseName: ai_learning
    user: ai_learning_user
    plan: free
